<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketUP — Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<meta name="theme-color" content="#AB1C1F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MarketUP">
<meta name="description" content="Catálogo e imprenta, sublimación y láser — pedidos directo por WhatsApp.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --mu-red:#AB1C1F;
    --mu-red-dark:#8A1518;
    --mu-ink:#303030;
    --mu-ink-soft:#4D4D4D;
    --mu-placeholder:#CCCCCC;
    --mu-bg:#F7F6F5;
    --mu-line:#E6E3E2;
    --mu-green:#25D366;
    --mu-green-dark:#128C43;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--mu-bg);color:var(--mu-ink);
    font-family:'Urbanist',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Urbanist',sans-serif;font-weight:800;margin:0;}
  button{font-family:inherit;}

  /* ---------- SPLASH (intro 3s, animada) ---------- */
  .splash{
    position:fixed;inset:0;z-index:1000;background:var(--mu-red);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;transition:opacity .5s ease;
  }
  .splash.hide{opacity:0;pointer-events:none;}
  .splash .dots{width:100px;height:auto;opacity:0;}
  .splash .badge{width:78px;height:78px;margin:6px 0;opacity:0;}

  @keyframes dotsPopInTop{
    0%{opacity:0;transform:scale(.5);}
    65%{opacity:1;transform:scale(1.06);}
    100%{opacity:1;transform:scale(1);}
  }
  @keyframes dotsPopInBottom{
    0%{opacity:0;transform:scaleY(-1) scale(.5);}
    65%{opacity:1;transform:scaleY(-1) scale(1.06);}
    100%{opacity:1;transform:scaleY(-1) scale(1);}
  }
  @keyframes dotsGlow{
    0%,100%{opacity:1;}
    50%{opacity:.72;}
  }
  @keyframes badgeIn{
    0%{opacity:0;transform:scale(.35) rotate(-22deg);}
    60%{opacity:1;transform:scale(1.12) rotate(4deg);}
    82%{transform:scale(.95) rotate(-2deg);}
    100%{opacity:1;transform:scale(1) rotate(0deg);}
  }
  @keyframes badgePulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }

  .splash .dots{
    animation: dotsPopInTop .6s cubic-bezier(.34,1.56,.64,1) .05s both,
               dotsGlow 2.2s ease-in-out .7s infinite;
  }
  .splash .dots.flip{
    animation: dotsPopInBottom .6s cubic-bezier(.34,1.56,.64,1) .15s both,
               dotsGlow 2.2s ease-in-out .8s infinite;
  }
  .splash .badge{
    animation: badgeIn .7s cubic-bezier(.34,1.56,.64,1) .3s both,
               badgePulse 1.9s ease-in-out 1.15s infinite;
  }

  /* ---------- HEADER ---------- */
  header{
    position:sticky;top:0;z-index:100;background:var(--mu-red);
    padding:18px 18px;display:flex;align-items:center;
  }
  .mu-wordmark{color:#fff;font-size:22px;font-weight:500;display:flex;align-items:flex-end;line-height:1;}
  .mu-wordmark .up-wrap{position:relative;margin-left:1px;}
  .mu-wordmark .up-wrap b{font-weight:800;}
  .mu-wordmark .roof{position:absolute;top:-9px;left:1px;width:13px;height:9px;}

  /* ---------- NAV DE CATEGORÍAS ---------- */
  .cat-nav{
    position:sticky;top:62px;z-index:99;background:#fff;
    display:flex;gap:8px;padding:12px 16px;overflow-x:auto;
    border-bottom:1px solid var(--mu-line);
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:0 0 auto;padding:7px 15px;border-radius:999px;border:1.5px solid var(--mu-red);
    background:#fff;color:var(--mu-red);font-weight:700;font-size:13.5px;
    cursor:pointer;white-space:nowrap;transition:.15s;
  }
  .cat-pill.active{background:var(--mu-red);color:#fff;}

  /* ---------- SECCIONES / GRID ---------- */
  main{max-width:920px;margin:0 auto;padding:24px 18px calc(24px + 82px);}
  .cat-section{margin-bottom:40px;scroll-margin-top:120px;}
  .cat-section + .cat-section{border-top:1px solid var(--mu-line);padding-top:36px;}
  .cat-section h2{font-size:21px;color:var(--mu-ink);margin-bottom:4px;}
  .cat-section .cat-count{color:var(--mu-ink-soft);font-size:13px;font-weight:600;margin-bottom:18px;display:block;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 20px;}

  /* ---------- RESPONSIVE: tablet / desktop ---------- */
  @media (min-width:640px){
    header{padding:20px 32px;}
    .cat-nav{max-width:1200px;margin:0 auto;padding:14px 32px;}
    main{max-width:1200px;padding:32px 32px calc(32px + 82px);}
    .cat-section h2{font-size:24px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:36px 26px;}
    .cart-inner{max-width:1200px;padding:16px 32px;}
    .checkout-content{padding:32px 24px;}
  }
  @media (min-width:1100px){
    main{max-width:1320px;}
    .cat-nav{max-width:1320px;}
    .cart-inner{max-width:1320px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:40px 28px;}
  }

  /* ---------- TARJETA DE ÍTEM (estilo plano, sin caja) ---------- */
  .card{display:flex;flex-direction:column;position:relative;}
  .card.agotado{opacity:.6;}
  .card .img-wrap{position:relative;aspect-ratio:1/1;background:var(--mu-placeholder);border-radius:4px;overflow:hidden;}
  .card .img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .img-wrap.zoomable{cursor:zoom-in;}
  .card .zoom-hint{
    position:absolute;bottom:6px;right:6px;background:rgba(48,48,48,.65);color:#fff;
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .card .zoom-hint svg{width:14px;height:14px;}

  /* ---------- LIGHTBOX (ver imagen ampliada) ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:500;background:rgba(20,20,20,.92);
    display:none;align-items:center;justify-content:center;padding:40px 16px;
    cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:6px;object-fit:contain;cursor:default;}
  .lightbox-close{
    position:absolute;top:18px;right:18px;background:rgba(255,255,255,.15);border:none;color:#fff;
    width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;
  }
  .card .badge-agotado{
    position:absolute;top:8px;right:8px;background:var(--mu-ink);color:#fff;
    font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;
  }
  .card .body{padding-top:10px;display:flex;flex-direction:column;gap:3px;flex:1;}
  .card .name{color:var(--mu-red);font-weight:800;font-size:15px;line-height:1.25;}
  .card .desc{color:var(--mu-ink);font-size:13px;font-weight:700;}
  .card .features{display:flex;flex-direction:column;gap:1px;margin:2px 0;}
  .card .feature-chip{font-size:12px;color:var(--mu-ink-soft);}
  .card select{
    width:100%;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--mu-ink);
    border:1.5px solid var(--mu-line);border-radius:8px;padding:5px 6px;background:#fff;margin-top:4px;
  }
  .card .design-note{font-size:11px;color:var(--mu-red);font-weight:700;line-height:1.3;margin-top:2px;}
  .card .price{font-weight:800;font-size:14px;color:var(--mu-ink);margin-top:2px;}
  .card .price-note{font-size:11px;color:var(--mu-ink-soft);font-style:italic;display:block;}
  .card .stepper-label{color:var(--mu-red);font-weight:800;font-size:13px;margin-top:8px;}
  .card .stepper-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:2px;padding-bottom:14px;border-bottom:1px solid var(--mu-line);
  }
  .card .subtotal-line{font-style:italic;font-size:12.5px;color:var(--mu-ink);}
  .card .subtotal-line b{font-style:normal;}
  .stepper{display:flex;align-items:center;border-radius:8px;overflow:hidden;}
  .stepper button{
    background:var(--mu-red);color:#fff;border:none;width:38px;height:38px;
    font-size:20px;font-weight:800;cursor:pointer;line-height:1;
  }
  .stepper button:active{background:var(--mu-red-dark);}
  .stepper .qty{width:44px;text-align:center;font-weight:800;font-size:16px;background:#fff;
    border-top:1.5px solid var(--mu-red);border-bottom:1.5px solid var(--mu-red);height:38px;line-height:38px;}
  .card.agotado .stepper button{pointer-events:none;opacity:.5;}

  /* ---------- BARRA DE CARRITO ---------- */
  .cart-bar{
    position:fixed;left:0;right:0;bottom:0;background:var(--mu-ink);color:#fff;
    z-index:200;box-shadow:0 -4px 16px rgba(0,0,0,.25);
  }
  .cart-inner{max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:10px;}
  #ticketToggle{background:none;border:none;color:#fff;text-align:left;cursor:pointer;padding:0;}
  #ticketToggle .count{display:block;font-size:12.5px;opacity:.85;}
  #ticketToggle .total{display:block;font-size:19px;font-weight:800;}
  .cart-toggle-btn{
    background:var(--mu-red);color:#fff;border:none;border-radius:999px;
    padding:13px 22px;font-weight:800;font-size:15px;cursor:pointer;
  }
  .cart-toggle-btn:disabled{background:#5a5a5a;opacity:.6;cursor:not-allowed;}

  /* ---------- CHECKOUT — pantalla completa por pasos ---------- */
  .checkout-overlay{
    position:fixed;inset:0;z-index:300;background:#fff;
    display:none;flex-direction:column;
  }
  .checkout-overlay.open{display:flex;}
  .checkout-header{
    flex:0 0 auto;padding:16px 16px 14px;border-bottom:1px solid var(--mu-line);
    position:relative;background:#fff;
  }
  .checkout-close{
    position:absolute;top:14px;right:14px;background:none;border:none;
    font-size:20px;color:var(--mu-ink-soft);cursor:pointer;width:36px;height:36px;
  }
  .step-indicator{display:flex;align-items:center;justify-content:center;gap:6px;max-width:420px;margin:8px auto 0;}
  .step-dot{
    width:30px;height:30px;border-radius:50%;background:var(--mu-line);color:var(--mu-ink-soft);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13.5px;flex:0 0 auto;
  }
  .step-dot.active{background:var(--mu-red);color:#fff;}
  .step-dot.done{background:var(--mu-ink);color:#fff;}
  .step-line{flex:1 1 auto;height:3px;background:var(--mu-line);border-radius:2px;}
  .step-line.done{background:var(--mu-ink);}
  .step-labels{display:flex;justify-content:center;gap:0;max-width:420px;margin:6px auto 0;text-align:center;}
  .step-labels span{flex:1;font-size:10.5px;font-weight:700;color:var(--mu-ink-soft);}
  .checkout-content{flex:1 1 auto;overflow-y:auto;padding:20px 18px 24px;max-width:520px;margin:0 auto;width:100%;}
  .checkout-content h2{font-size:19px;color:var(--mu-ink);margin-bottom:16px;}
  .wa-btn{
    background:var(--mu-green);color:#fff;border:none;border-radius:999px;
    padding:15px 22px;display:flex;align-items:center;justify-content:center;gap:10px;
    font-weight:800;font-size:16px;cursor:pointer;width:100%;margin-top:12px;
  }
  .wa-btn:disabled{background:#9bb;opacity:.5;cursor:not-allowed;}
  .wa-btn svg{width:22px;height:22px;flex:0 0 auto;}

  /* ---------- CONTENIDO DE PASOS (reutiliza clases dentro de .checkout-content) ---------- */
  .ticket-row{display:flex;justify-content:space-between;padding:10px 0;font-size:15px;border-bottom:1px solid var(--mu-line);}
  .ticket-empty{color:var(--mu-ink-soft);font-size:14px;padding:30px 0;text-align:center;}
  .step-next-btn{
    background:var(--mu-red);color:#fff;border:none;border-radius:10px;
    padding:16px 18px;font-weight:800;font-size:16px;cursor:pointer;width:100%;margin-top:18px;
  }
  .step-next-btn:disabled{background:var(--mu-placeholder);color:var(--mu-ink-soft);cursor:not-allowed;}
  .step-back-btn{
    background:none;border:none;color:var(--mu-ink-soft);font-weight:700;font-size:14px;
    padding:0 0 16px;cursor:pointer;
  }

  /* ---------- ENTREGA ---------- */
  .delivery-block{padding:4px 0 0;}
  .delivery-title{font-weight:800;color:var(--mu-red);font-size:14.5px;margin-bottom:10px;}
  .delivery-option{display:flex;align-items:center;gap:10px;font-size:14.5px;padding:8px 0;cursor:pointer;}
  .delivery-option input{width:18px;height:18px;}
  .delivery-details{margin-top:8px;padding-left:2px;}
  .delivery-details textarea{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border:1.5px solid var(--mu-line);border-radius:8px;resize:vertical;}
  .loc-btn{margin-top:10px;background:#fff;border:1.5px solid var(--mu-red);color:var(--mu-red);font-weight:700;font-size:13.5px;padding:11px 12px;border-radius:8px;width:100%;}
  .loc-status{font-size:12.5px;color:var(--mu-ink-soft);margin-top:6px;}
  .loc-status.ok{color:#1E7A34;font-weight:700;}
  .delivery-hint{font-size:12px;color:var(--mu-ink-soft);text-align:center;margin-top:8px;}

  /* ---------- OVERLAY DE AGRADECIMIENTO ---------- */
  .thanks-overlay{
    position:fixed;inset:0;z-index:400;background:rgba(48,48,48,.7);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .thanks-overlay.open{display:flex;}
  .thanks-box{background:#fff;border-radius:18px;padding:30px 22px 26px;max-width:340px;text-align:center;}
  .thanks-box .thanks-badge{width:56px;height:56px;margin:0 auto 14px;}
  .thanks-box h3{color:var(--mu-red);font-size:19px;margin-bottom:8px;}
  .thanks-box p{color:var(--mu-ink-soft);font-size:14px;margin:0 0 4px;}
  #thanksTotal{font-weight:800;color:var(--mu-ink);margin-bottom:18px;display:block;}
  .thanks-btn-primary{
    background:var(--mu-green);color:#fff;border:none;border-radius:999px;
    padding:12px 20px;font-weight:800;font-size:14.5px;width:100%;cursor:pointer;
  }

  /* ---------- FOOTER ---------- */
  footer .mu-badge{width:52px;height:52px;margin:0 auto 10px;}
  footer p{color:#B9B7B6;font-size:12.5px;margin:0;}
</style>
</head>
<body>

<!-- ---------- INTRO / SPLASH (3s) ---------- -->

  <!-- Wordmark en blanco, para fondo rojo -->

<nav class="cat-nav" id="catNav"></nav>

<div class="cart-bar">

    <button id="ticketToggle">
      <span class="count" id="cartCount">0 productos</span>

<div class="checkout-overlay" id="checkoutOverlay">

<script>
  // ⚠️ Reemplazá con tu número real (código de país + número, sin espacios ni +)
  const WHATSAPP_NUMBER = "59170857324";
  const SUPABASE_URL = "https://yjzolvnhxegonljdpbfz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_S0lJAK4sfBtd53F18myfPg_uUUXWsAN";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function fmt(n){ return Number(n).toLocaleString('es-BO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

  const cart = {};          // comboKey -> {name, categoryName, variantLabel, unitPrice, qty, requiresDesign}
  const cardSelection = {}; // itemId -> { groupId: optionId }
  const delivery = { method: null, address: '', mapsUrl: null }; // 'oficina' | 'delivery'

  function comboKey(item){
    const groups = item.item_variant_groups || [];
    if(groups.length === 0) return String(item.id);
    const sel = cardSelection[item.id] || {};
    return item.id + '::' + groups.map(g => sel[g.id]).join('-');
  }

  function comboLabel(item){
    const groups = item.item_variant_groups || [];
    if(groups.length === 0) return '';
    const sel = cardSelection[item.id] || {};
    return groups.map(g => {
      const opt = (g.item_variant_options||[]).find(o => o.id === sel[g.id]);
      return opt ? opt.value : '';
    }).filter(Boolean).join(' / ');
  }

  function syncCardDisplay(item){
    const key = comboKey(item);
    const qty = (cart[key] && cart[key].qty) || 0;
    const qtyEl = document.getElementById(`qty-${item.id}`);
    const subEl = document.getElementById(`subtotal-${item.id}`);
    if(qtyEl) qtyEl.textContent = qty;
    if(subEl) subEl.textContent = fmt(qty * item.price);
  }

  function updateQty(item, delta){
    const key = comboKey(item);
    const current = (cart[key] && cart[key].qty) || 0;
    const next = Math.max(0, current + delta);
    if(next === 0){
      delete cart[key];
    } else {
      cart[key] = {
        name: item.name,
        variantLabel: comboLabel(item),
        unitPrice: item.price,
        qty: next,
        requiresDesign: item.requires_custom_design
      };
    }
    syncCardDisplay(item);
    renderCartSummary();
  }

  function renderCard(item, categoryName){
    const groups = item.item_variant_groups || [];
    const features = item.item_features || [];
    if(groups.length){
      cardSelection[item.id] = {};
      groups.forEach(g => {
        const opts = (g.item_variant_options||[]).slice().sort((a,b)=>a.sort_order-b.sort_order);
        if(opts[0]) cardSelection[item.id][g.id] = opts[0].id;
      });
    }

    const card = document.createElement('div');
    card.className = 'card' + (item.status === 'agotado' ? ' agotado' : '');

    const imgHtml = item.image_url
      ? `<img src="${item.image_url}" alt="${item.name}">`
      : '';

    const featuresHtml = features.length
      ? `<div class="features">${features.slice().sort((a,b)=>a.sort_order-b.sort_order).map(f => `<span class="feature-chip">${f.label}: ${f.value}</span>`).join('')}</div>`
      : '';

    const selectsHtml = groups.slice().sort((a,b)=>a.sort_order-b.sort_order).map(g => {
      const opts = (g.item_variant_options||[]).slice().sort((a,b)=>a.sort_order-b.sort_order);
      return `<select data-group="${g.id}" aria-label="${g.name}">
        ${opts.map(o => `<option value="${o.id}">${g.name}: ${o.value}</option>`).join('')}
      </select>`;
    }).join('');

    const designNote = item.requires_custom_design
      ? `<div class="design-note">📎 Recordá adjuntar tu diseño en este chat al pedir</div>`
      : '';

    const priceNote = item.price_note
      ? `<span class="price-note">${item.price_note}</span>`
      : '';

    const zoomHint = item.image_url
      ? `<span class="zoom-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg></span>`
      : '';

    card.innerHTML = `
      <div class="img-wrap${item.image_url ? ' zoomable' : ''}">
        ${imgHtml}
        ${zoomHint}
        ${item.status === 'agotado' ? '<span class="badge-agotado">Agotado</span>' : ''}
      </div>
      <div class="body">
        <div class="name">${item.name}</div>
        ${item.description ? `<div class="desc">${item.description}</div>` : ''}
        ${featuresHtml}
        ${selectsHtml}
        ${designNote}
        <div class="price">${fmt(item.price)} Bs.${priceNote}</div>
        <div class="stepper-label">Cantidad</div>
        <div class="stepper-row">
          <span class="subtotal-line">Subtotal <b id="subtotal-${item.id}">0.00</b></span>
          <div class="stepper">
            <button type="button" aria-label="Restar">–</button>
            <span class="qty" id="qty-${item.id}">0</span>
            <button type="button" aria-label="Sumar">+</button>
          </div>
        </div>
      </div>
    `;

    const [minusBtn, plusBtn] = card.querySelectorAll('.stepper button');
    minusBtn.onclick = () => updateQty(item, -1);
    plusBtn.onclick = () => updateQty(item, 1);
    card.querySelectorAll('select').forEach(sel => {
      sel.onchange = () => {
        cardSelection[item.id][sel.dataset.group] = Number(sel.value);
        syncCardDisplay(item);
      };
    });
    if(item.image_url){
      card.querySelector('.img-wrap').onclick = () => openLightbox(item.image_url, item.name);
    }

    return card;
  }

  function openLightbox(src, alt){
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxImg').alt = alt || '';
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('open');
  }
  document.getElementById('lightboxClose').onclick = closeLightbox;
  document.getElementById('lightbox').onclick = (e) => {
    if(e.target.id === 'lightbox') closeLightbox();
  };
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeLightbox();
  });

  function deliveryIsValid(){
    if(delivery.method === 'oficina') return true;
    if(delivery.method === 'delivery') return !!(delivery.address.trim() || delivery.mapsUrl);
    return false;
  }

  function renderDeliveryBlock(){
    return `
      <div class="delivery-block">
        <label class="delivery-option">
          <input type="radio" name="deliveryMethod" value="oficina" ${delivery.method==='oficina'?'checked':''}>
          Recoger en oficina
        </label>
        <label class="delivery-option">
          <input type="radio" name="deliveryMethod" value="delivery" ${delivery.method==='delivery'?'checked':''}>
          Delivery a domicilio
        </label>
        ${delivery.method === 'delivery' ? `
          <div class="delivery-details">
            <textarea id="deliveryAddress" rows="2" placeholder="Escribí tu dirección de referencia (calle, zona, referencia)">${delivery.address}</textarea>
            <button type="button" class="loc-btn" id="useLocationBtn">📍 Usar mi ubicación</button>
            <div class="loc-status ${delivery.mapsUrl ? 'ok' : ''}" id="locStatus">${delivery.mapsUrl ? '✓ Ubicación capturada' : ''}</div>
          </div>
        ` : ''}
      </div>
    `;
  }

  function refreshStep2Button(){
    const btn = document.getElementById('goToConfirmBtn');
    if(btn) btn.disabled = !deliveryIsValid();
  }

  function bindDeliveryHandlers(){
    document.querySelectorAll('input[name="deliveryMethod"]').forEach(r => {
      r.onchange = () => { delivery.method = r.value; renderStep(); };
    });
    const addressEl = document.getElementById('deliveryAddress');
    if(addressEl){
      addressEl.oninput = (e) => { delivery.address = e.target.value; refreshStep2Button(); };
    }
    const locBtn = document.getElementById('useLocationBtn');
    if(locBtn){
      locBtn.onclick = () => {
        if(!navigator.geolocation){
          alert('Tu navegador no permite compartir ubicación. Escribí la dirección en el campo de arriba.');
          return;
        }
        locBtn.disabled = true;
        locBtn.textContent = 'Obteniendo ubicación...';
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            delivery.mapsUrl = `https://maps.google.com/?q=${latitude},${longitude}`;
            renderStep();
          },
          () => {
            alert('No pudimos obtener tu ubicación. Podés escribir la dirección en el campo de arriba en su lugar.');
            locBtn.disabled = false;
            locBtn.textContent = '📍 Usar mi ubicación';
          },
          { enableHighAccuracy:true, timeout:10000 }
        );
      };
    }
    refreshStep2Button();
  }

  const STEP_LABELS = ['Tu pedido', 'Entrega', 'Confirmar'];
  const STEP_KEYS = ['items', 'delivery', 'confirm'];
  let checkoutStep = 'items';

  function renderStepIndicator(){
    const activeIdx = STEP_KEYS.indexOf(checkoutStep);
    let dots = '';
    STEP_LABELS.forEach((label, i) => {
      const cls = i < activeIdx ? 'done' : i === activeIdx ? 'active' : '';
      dots += `<div class="step-dot ${cls}">${i < activeIdx ? '✓' : i+1}</div>`;
      if(i < STEP_LABELS.length - 1){
        dots += `<div class="step-line ${i < activeIdx ? 'done' : ''}"></div>`;
      }
    });
    document.getElementById('stepIndicator').innerHTML = dots;
  }

  function renderStep(){
    const lines = Object.values(cart);
    const totalPrice = lines.reduce((s,l) => s + l.qty * l.unitPrice, 0);
    const content = document.getElementById('checkoutContent');

    if(lines.length === 0){
      checkoutStep = 'items';
      document.getElementById('checkoutOverlay').classList.remove('open');
      return;
    }

    renderStepIndicator();

    if(checkoutStep === 'items'){
      content.innerHTML = `
        <h2>Tu pedido</h2>
        ${lines.map(l => `
          <div class="ticket-row">
            <span>${l.name}${l.variantLabel ? ' ('+l.variantLabel+')' : ''} × ${l.qty}</span>
            <span>${fmt(l.qty * l.unitPrice)} Bs.</span>
          </div>
        `).join('')}
        <div class="ticket-row" style="font-weight:800;border-top:1.5px solid var(--mu-red);margin-top:4px;padding-top:8px;border-bottom:none;">
          <span>Total</span><span>${fmt(totalPrice)} Bs.</span>
        </div>
        <button class="step-next-btn" id="goToDeliveryBtn">Continuar → Elegir entrega</button>
      `;
      document.getElementById('goToDeliveryBtn').onclick = () => { checkoutStep = 'delivery'; renderStep(); };

    } else if(checkoutStep === 'delivery'){
      content.innerHTML = `
        <button class="step-back-btn" id="backToItemsBtn">← Volver a mi pedido</button>
        <h2>¿Cómo recibís tu pedido?</h2>
        ${renderDeliveryBlock()}
        <button class="step-next-btn" id="goToConfirmBtn" ${deliveryIsValid()?'':'disabled'}>Continuar → Confirmar</button>
      `;
      document.getElementById('backToItemsBtn').onclick = () => { checkoutStep = 'items'; renderStep(); };
      document.getElementById('goToConfirmBtn').onclick = () => { checkoutStep = 'confirm'; renderStep(); };
      bindDeliveryHandlers();

    } else {
      const deliveryText = delivery.method === 'oficina'
        ? 'Retiro en oficina'
        : `Delivery${delivery.address.trim() ? ' — '+delivery.address.trim() : ''}${delivery.mapsUrl ? ' (con ubicación GPS)' : ''}`;
      content.innerHTML = `
        <button class="step-back-btn" id="backToDeliveryBtn">← Volver a entrega</button>
        <h2>Confirmá tu pedido</h2>
        ${lines.map(l => `
          <div class="ticket-row">
            <span>${l.name}${l.variantLabel ? ' ('+l.variantLabel+')' : ''} × ${l.qty}</span>
            <span>${fmt(l.qty * l.unitPrice)} Bs.</span>
          </div>
        `).join('')}
        <div class="ticket-row" style="font-weight:800;border-top:1.5px solid var(--mu-red);margin-top:4px;padding-top:8px;">
          <span>Total</span><span>${fmt(totalPrice)} Bs.</span>
        </div>
        <div class="ticket-row" style="border-bottom:none;">
          <span>Entrega</span><span style="text-align:right;max-width:60%;">${deliveryText}</span>
        </div>
        <button class="wa-btn" id="waBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.37 5.07L2 22l5.06-1.33A9.93 9.93 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18a7.9 7.9 0 0 1-4.05-1.11l-.29-.17-3 .79.8-2.93-.19-.3A7.93 7.93 0 1 1 12 20zm4.4-5.9c-.24-.12-1.43-.7-1.65-.78-.22-.08-.38-.12-.54.12s-.62.78-.76.94-.28.18-.52.06a6.5 6.5 0 0 1-1.91-1.18 7.15 7.15 0 0 1-1.32-1.64c-.14-.24 0-.36.1-.48.11-.11.24-.28.36-.42a1.6 1.6 0 0 0 .24-.4.44.44 0 0 0 0-.42c-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.4-.54-.41h-.46a.9.9 0 0 0-.65.3 2.7 2.7 0 0 0-.84 2 4.7 4.7 0 0 0 1 2.5 10.8 10.8 0 0 0 4.13 3.65c.58.25 1.03.4 1.38.51a3.3 3.3 0 0 0 1.53.1 2.5 2.5 0 0 0 1.64-1.15 2 2 0 0 0 .14-1.15c-.06-.1-.22-.16-.46-.28z"/></svg>
          <span>Enviar pedido por WhatsApp</span>
        </button>
      `;
      document.getElementById('backToDeliveryBtn').onclick = () => { checkoutStep = 'delivery'; renderStep(); };
      document.getElementById('waBtn').onclick = submitOrder;
    }
  }

  function renderCartSummary(){
    const lines = Object.values(cart);
    const totalQty = lines.reduce((s,l) => s + l.qty, 0);
    const totalPrice = lines.reduce((s,l) => s + l.qty * l.unitPrice, 0);

    document.getElementById('cartCount').textContent = totalQty === 0 ? '0 productos' : `${totalQty} producto${totalQty>1?'s':''}`;
    document.getElementById('cartTotal').textContent = fmt(totalPrice) + ' Bs.';
    document.getElementById('cartToggleBtn').disabled = lines.length === 0;

    if(document.getElementById('checkoutOverlay').classList.contains('open')){
      renderStep();
    }
  }

  function openCheckout(){
    if(Object.keys(cart).length === 0) return;
    renderStep();
    document.getElementById('checkoutOverlay').classList.add('open');
  }
  document.getElementById('ticketToggle').onclick = openCheckout;
  document.getElementById('cartToggleBtn').onclick = openCheckout;
  document.getElementById('checkoutCloseBtn').onclick = () => document.getElementById('checkoutOverlay').classList.remove('open');

  let lastWhatsappUrl = '';

  async function submitOrder(){
    const lines = Object.values(cart);
    if(lines.length === 0 || !deliveryIsValid()) return;
    const totalPrice = lines.reduce((s,l) => s + l.qty * l.unitPrice, 0);

    let msg = "Hola, quiero confirmar este pedido en MarketUP:\n\n";
    lines.forEach(l => {
      msg += `• ${l.name}${l.variantLabel ? ' ('+l.variantLabel+')' : ''} x${l.qty} — ${fmt(l.qty*l.unitPrice)} Bs.\n`;
    });
    msg += `\nTotal: ${fmt(totalPrice)} Bs.`;

    if(delivery.method === 'oficina'){
      msg += `\n\n📍 Entrega: Retiro en oficina`;
    } else if(delivery.method === 'delivery'){
      msg += `\n\n📍 Entrega: Delivery a domicilio`;
      if(delivery.address.trim()) msg += `\nDirección: ${delivery.address.trim()}`;
      if(delivery.mapsUrl) msg += `\nUbicación: ${delivery.mapsUrl}`;
    }

    const designItems = lines.filter(l => l.requiresDesign).map(l => l.name);
    if(designItems.length){
      msg += `\n\n📎 Voy a adjuntar el diseño de: ${designItems.join(', ')} en este mismo chat.`;
    }

    try{
      await sb.from('orders').insert({
        items: lines.map(l => ({ name:l.name, variant:l.variantLabel, qty:l.qty, subtotal:l.qty*l.unitPrice, requires_custom_design:l.requiresDesign })),
        total: totalPrice,
        delivery_method: delivery.method,
        delivery_address: delivery.address.trim() || null,
        delivery_maps_url: delivery.mapsUrl
      });
    }catch(e){ console.warn('No se pudo registrar el pedido:', e); }

    lastWhatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
    document.getElementById('checkoutOverlay').classList.remove('open');
    document.getElementById('thanksTotal').textContent = `Total del pedido: ${fmt(totalPrice)} Bs.`;
    document.getElementById('thanksOverlay').classList.add('open');
  }

  document.getElementById('thanksSendBtn').onclick = () => {
    if(lastWhatsappUrl) window.open(lastWhatsappUrl, '_blank');
    document.getElementById('thanksOverlay').classList.remove('open');
    Object.keys(cart).forEach(k => delete cart[k]);
    delivery.method = null; delivery.address = ''; delivery.mapsUrl = null;
    checkoutStep = 'items';
    document.querySelectorAll('.qty').forEach(el => el.textContent = '0');
    document.querySelectorAll('[id^="subtotal-"]').forEach(el => el.textContent = '0.00');
    renderCartSummary();
  };

  async function loadCatalog(){
    const main = document.getElementById('main');
    try{
      const { data: categories, error: catErr } = await sb.from('categories').select('*').order('sort_order');
      if(catErr) throw catErr;

      const { data: items, error: itemErr } = await sb
        .from('items')
        .select('*, item_features(*), item_variant_groups(*, item_variant_options(*))')
        .neq('status', 'oculto')
        .order('sort_order');
      if(itemErr) throw itemErr;

      main.innerHTML = '';
      const catNav = document.getElementById('catNav');
      catNav.innerHTML = '';

      let anyRendered = false;

      categories.forEach(cat => {
        const catItems = items.filter(i => i.category_id === cat.id);
        if(catItems.length === 0) return;
        anyRendered = true;

        const pill = document.createElement('button');
        pill.className = 'cat-pill';
        pill.textContent = cat.name;
        pill.onclick = () => document.getElementById('cat-'+cat.slug).scrollIntoView({behavior:'smooth', block:'start'});
        catNav.appendChild(pill);

        const section = document.createElement('div');
        section.className = 'cat-section';
        section.id = 'cat-'+cat.slug;
        section.innerHTML = `<h2>${cat.name}</h2><span class="cat-count">${catItems.length} producto${catItems.length>1?'s':''}</span>`;

        const grid = document.createElement('div');
        grid.className = 'grid';
        catItems.forEach(item => grid.appendChild(renderCard(item, cat.name)));
        section.appendChild(grid);
        main.appendChild(section);
      });

      if(!anyRendered){
        main.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--mu-ink-soft);">Todavía no hay productos cargados en el catálogo.</div>';
      }

      renderCartSummary();
    }catch(e){
      console.error(e);
      main.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--mu-red);">No pudimos cargar el catálogo. Intentá de nuevo en un momento.</div>';
    }
  }

  loadCatalog();

  setTimeout(() => { document.getElementById('splash').classList.add('hide'); }, 3000);

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
